# Tests WeaveEngine and builds the desktop app on macOS, Windows and Linux.
# Runs on every push to a branch, on version tags such as v1.0.0, and by hand
# (Actions tab, "Run workflow"); not for branches named sweep/..., which start
# the board sweep alone (sweep.yml). Each build is uploaded as an artifact of the run.
# For a version tag, once all three have built and passed, a GitHub Release is
# published with the three attached and .github/release-notes.md as its text.
name: build

on:
  push:
    branches-ignore: ["sweep/**"]
    tags: ["v*"]
  workflow_dispatch:

# A new push to a branch stops the run still going for the one before.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux: built on the oldest Ubuntu still supported, so the app runs on it
        # and everything newer (a build needs at least the C library it was made with).
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -e . --no-deps
      - name: Test
        shell: bash
        # A failure is also posted as annotations, readable without signing in.
        run: |
          set +e   # (steps run with -e: the status is wanted, not an exit)
          python -m pytest -q -rfE --tb=short > pytest.txt 2>&1; status=$?
          tail -n 60 pytest.txt
          if [ $status -ne 0 ]; then PYTHONIOENCODING=utf-8 python .github/annotate.py pytest.txt; fi
          exit $status
      - name: Route a board from the command line
        run: python -m weaveengine.cli "boards/pic-programmer/pic-programmer.dsn" -o pic.ses --quiet
      - name: Build the app
        run: pyinstaller --noconfirm WeaveEngine.spec
      # The app as packaged, not the source: open a board, route it, export the
      # session, take a screenshot (``self_test``), on each system.
      - name: Run the packaged app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: mkdir -p selftest && dist/WeaveEngine.app/Contents/MacOS/WeaveEngine --self-test "boards/pic-programmer/pic-programmer.dsn" --ses app.ses --screenshot selftest/macos.png
      - name: Run the packaged app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        # (a windowed program: no output to show, and the shell does not wait for it unless told to)
        run: |
          New-Item -ItemType Directory -Force selftest | Out-Null
          $p = Start-Process -FilePath dist\WeaveEngine\WeaveEngine.exe -Wait -PassThru `
            -ArgumentList '--self-test', '"boards/pic-programmer/pic-programmer.dsn"', '--ses', 'app.ses', '--screenshot', 'selftest/windows.png'
          if ($p.ExitCode -ne 0) { throw "the packaged app's self-test ended with $($p.ExitCode)" }
          if (-not (Test-Path app.ses)) { throw "the packaged app wrote no session" }
      - name: Run the packaged app (Linux, on bare Ubuntu 22.04 and 24.04 with an X display)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          for image in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -v "$PWD:/w" -w /w -e QT_QPA_PLATFORM=xcb "$image" .github/linux-selftest.sh || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ runner.os }}
          path: selftest/
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent WeaveEngine.app ../WeaveEngine-macos.zip
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/WeaveEngine -DestinationPath WeaveEngine-windows.zip
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar -czf WeaveEngine-linux.tar.gz -C dist WeaveEngine
      # (the package itself, not zipped again: a download from the run is the
      # same file as the release's; the file's name is the artifact's)
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.os == 'Windows' && 'WeaveEngine-windows.zip' || runner.os == 'macOS' && 'WeaveEngine-macos.zip' || 'WeaveEngine-linux.tar.gz' }}
          archive: false

  # On every push the three packages are gathered and checked; for a version
  # tag they are also published as a release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: WeaveEngine-*
          path: packages
          merge-multiple: true
          skip-decompress: true
      - name: Check the packages
        run: |
          ls -l packages
          for f in WeaveEngine-macos.zip WeaveEngine-windows.zip WeaveEngine-linux.tar.gz; do
            test -s "packages/$f" || { echo "::error::$f is missing"; exit 1; }
          done
          unzip -l packages/WeaveEngine-windows.zip | grep -qE "WeaveEngine[/\\]WeaveEngine\.exe" || { echo "::error::the Windows zip does not hold WeaveEngine/WeaveEngine.exe"; exit 1; }
          unzip -l packages/WeaveEngine-macos.zip | grep -q "WeaveEngine.app/Contents/MacOS/WeaveEngine" || { echo "::error::the macOS zip does not hold the app"; exit 1; }
          tar -tzf packages/WeaveEngine-linux.tar.gz | grep -q "^WeaveEngine/WeaveEngine$" || { echo "::error::the Linux archive does not hold WeaveEngine/WeaveEngine"; exit 1; }
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* --verify-tag --latest \
            --title "WeaveEngine ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
