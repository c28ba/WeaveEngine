# Tests WeaveEngine and builds the desktop app on macOS, Windows and Linux.
# Runs on every push (branches and version tags such as v1.0.0) and by hand
# (Actions tab, "Run workflow"). Each build is uploaded as an artifact of the run.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -e . --no-deps
      - name: Test
        shell: bash
        # A failure is also posted as annotations, readable without signing in.
        run: |
          python -m pytest -q -rfE --tb=short > pytest.txt 2>&1; status=$?
          tail -n 60 pytest.txt
          if [ $status -ne 0 ]; then python .github/annotate.py pytest.txt; fi
          exit $status
      - name: Route a board from the command line
        run: python -m weaveengine.cli "boards/Word of RAM.dsn" -o word.ses --quiet
      - name: Build the app
        run: pyinstaller --noconfirm WeaveEngine.spec
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent WeaveEngine.app ../WeaveEngine-macos.zip
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/WeaveEngine -DestinationPath WeaveEngine-windows.zip
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar -czf WeaveEngine-linux.tar.gz -C dist WeaveEngine
      - uses: actions/upload-artifact@v4
        with:
          name: WeaveEngine-${{ runner.os }}
          path: WeaveEngine-*.*
